name: Self-hosted Smoke
on:
  workflow_dispatch:
jobs:
  smoke:
    if: github.repository == 'dyyz1993/WebBridgeKit-Framework' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, nas]
    timeout-minutes: 10
    steps:
      - name: env probe
        run: |
          uname -m
          docker info --format "dind server: {{.ServerVersion}}"
          java -version 2>&1 | head -1
          go version
          node --version
          python3 --version
          flutter --version 2>&1 | head -1
          gh --version | head -1
